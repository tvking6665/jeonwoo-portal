<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>layout check</title>
<style>
body { margin:0; background:#1b1f27; display:flex; gap:16px; padding:16px; color:#fff; font-family:sans-serif; align-items:flex-start; }
.col { display:flex; flex-direction:column; gap:6px; }
iframe { border:0; background:#fff; display:block; }
pre { color:#9fe; font-size:12px; }
</style></head>
<body>
<div class="col"><div>390</div><iframe id="f390" src="index.html" width="390" height="844"></iframe></div>
<div class="col"><div>768</div><iframe id="f768" src="index.html" width="768" height="900"></iframe></div>
<div class="col"><div>1024</div><iframe id="f1024" src="index.html" width="1024" height="800"></iframe></div>
<pre id="out">measuring…</pre>
<script>
const PW = 'jwjm1234';
function prep(f) {
  const d = f.contentDocument;
  if (!d || !d.querySelector('#gateForm')) return;
  const gate = d.querySelector('#gate');
  if (gate && !gate.hidden) {
    d.querySelector('#gatePassword').value = PW;
    d.querySelector('#gateForm').dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));
  }
}
function measure() {
  const res = {};
  ['f390', 'f768', 'f1024'].forEach(id => {
    const f = document.getElementById(id), d = f.contentDocument;
    const hero = d.querySelector('.hero');
    res[id] = {
      scrollW: d.documentElement.scrollWidth,
      clientW: d.documentElement.clientWidth,
      heroH: hero ? Math.round(hero.getBoundingClientRect().height) : null,
      heroW: hero ? Math.round(hero.getBoundingClientRect().width) : null,
      appHidden: d.querySelector('#app').hidden,
      stats: [...d.querySelectorAll('[data-stat]')].map(e => e.textContent).join('/')
    };
  });
  document.getElementById('out').textContent = JSON.stringify(res, null, 1);
}
window.addEventListener('load', () => {
  setTimeout(() => {
    ['f390', 'f768', 'f1024'].forEach(id => prep(document.getElementById(id)));
    setTimeout(measure, 1200);
  }, 700);
});
</script>
</body></html>
