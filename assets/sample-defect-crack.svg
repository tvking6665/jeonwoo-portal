<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="출구 비전 검사 크랙 검출 화면">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b6b85"/>
      <stop offset="0.45" stop-color="#3d4b63"/>
      <stop offset="1" stop-color="#2a3446"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17233a"/>
      <stop offset="1" stop-color="#0c1524"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#3f6fd8" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <pattern id="hazard" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="12" height="12" fill="#1a0f12"/>
      <rect width="6" height="12" fill="#7f1d1d"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="lensClip"><circle cx="742" cy="292" r="138"/></clipPath>
  </defs>

  <rect width="960" height="600" fill="#0a1120"/>
  <rect width="960" height="600" fill="url(#grid)"/>

  <!-- camera corner marks -->
  <g stroke="#3b82f6" stroke-opacity="0.55" stroke-width="2" fill="none">
    <path d="M24 64V40h24"/><path d="M912 64V40h-24"/>
    <path d="M24 512v24h24"/><path d="M912 512v24h-24"/>
  </g>

  <!-- top bar -->
  <rect x="0" y="0" width="960" height="52" fill="#060c17" fill-opacity="0.92"/>
  <line x1="0" y1="52" x2="960" y2="52" stroke="#1e3a6b"/>
  <rect x="24" y="16" width="8" height="20" rx="2" fill="#ef4444"/>
  <text x="42" y="31" fill="#e2ecff" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="700" letter-spacing="1.4">VISION INSPECTION</text>
  <text x="214" y="31" fill="#6d86b3" font-family="Consolas, 'Courier New', monospace" font-size="12" letter-spacing="1">LINE 2 · OUTLET / CAM-04</text>
  <text x="936" y="31" text-anchor="end" fill="#8fa8cf" font-family="Consolas, 'Courier New', monospace" font-size="12">2026-11-18  14:32:07</text>

  <!-- part -->
  <g transform="translate(78,140)">
    <path d="M18 0 H382 Q400 0 400 18 V212 Q400 230 382 230 H210 V300 Q210 306 204 306 H18 Q0 306 0 288 V18 Q0 0 18 0 Z"
          fill="url(#metal)" stroke="#7c8ca8" stroke-width="1.5"/>
    <circle cx="82" cy="72" r="27" fill="#16202f" stroke="#8fa0bb" stroke-width="1.5"/>
    <circle cx="82" cy="168" r="27" fill="#16202f" stroke="#8fa0bb" stroke-width="1.5"/>
    <circle cx="322" cy="115" r="33" fill="#16202f" stroke="#8fa0bb" stroke-width="1.5"/>
    <circle cx="322" cy="115" r="22" fill="none" stroke="#4a5b74" stroke-width="1" stroke-dasharray="3 4"/>
    <rect x="24" y="238" width="152" height="42" rx="6" fill="#26313f" stroke="#4b5a72"/>
    <text x="100" y="264" text-anchor="middle" fill="#7f90a8" font-family="Consolas, monospace" font-size="12" letter-spacing="1.5">JW-BRK-2041</text>
  </g>

  <!-- crack highlight -->
  <g filter="url(#glow)">
    <path d="M470 216 L462 238 L472 254 L460 272 L468 292 L458 312" fill="none" stroke="#ff4d4d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g stroke="#ff6b6b" stroke-opacity="0.55" stroke-width="1" stroke-dasharray="5 5">
    <line x1="410" y1="264" x2="530" y2="264"/>
    <line x1="470" y1="190" x2="470" y2="340"/>
  </g>
  <circle cx="465" cy="264" r="46" fill="none" stroke="#ff6b6b" stroke-width="1.6" stroke-dasharray="6 4"/>

  <!-- leader to label -->
  <line x1="508" y1="142" x2="474" y2="208" stroke="#ff8a8a" stroke-width="1.2"/>
  <rect x="500" y="98" width="168" height="46" rx="6" fill="#2a0f14" fill-opacity="0.92" stroke="#b91c1c"/>
  <text x="513" y="116" fill="#ff9d9d" font-family="Consolas, monospace" font-size="10" letter-spacing="1.4">DEFECT · NG</text>
  <text x="513" y="134" fill="#ffd7d7" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="12" font-weight="700">미세 크랙 0.35 mm</text>

  <!-- connector to lens -->
  <line x1="500" y1="264" x2="600" y2="264" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.2"/>
  <polygon points="600,260 608,264 600,268" fill="#38bdf8" fill-opacity="0.6"/>

  <!-- magnified lens -->
  <circle cx="742" cy="292" r="146" fill="#0c1524" stroke="#1e3a6b" stroke-width="2"/>
  <circle cx="742" cy="292" r="138" fill="url(#lens)" stroke="#38bdf8" stroke-opacity="0.65" stroke-width="1.5"/>
  <g clip-path="url(#lensClip)">
    <g transform="translate(742,292)">
      <!-- metal surface -->
      <rect x="-138" y="-138" width="276" height="276" fill="#243046"/>
      <g stroke="#33415c" stroke-width="0.8">
        <line x1="-138" y1="-90" x2="138" y2="-90"/>
        <line x1="-138" y1="-30" x2="138" y2="-30"/>
        <line x1="-138" y1="30" x2="138" y2="30"/>
        <line x1="-138" y1="90" x2="138" y2="90"/>
        <line x1="-90" y1="-138" x2="-90" y2="138"/>
        <line x1="-30" y1="-138" x2="-30" y2="138"/>
        <line x1="30" y1="-138" x2="30" y2="138"/>
        <line x1="90" y1="-138" x2="90" y2="138"/>
      </g>
      <path d="M-64 -118 L-40 -62 L-14 -34 L-26 6 L4 40 L-10 78 L18 122"
            fill="none" stroke="#ff5252" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
      <path d="M-64 -118 L-40 -62 L-14 -34 L-26 6 L4 40 L-10 78 L18 122"
            fill="none" stroke="#ffb3b3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- measurement ticks -->
      <g stroke="#38bdf8" stroke-width="1.4">
        <line x1="-40" y1="-46" x2="-40" y2="-14"/>
        <line x1="-48" y1="-46" x2="-32" y2="-46"/>
        <line x1="-48" y1="-14" x2="-32" y2="-14"/>
      </g>
      <text x="-30" y="-24" fill="#7dd3fc" font-family="Consolas, monospace" font-size="12" font-weight="700">0.35 mm</text>
      <!-- scale bar -->
      <g transform="translate(-96,104)">
        <line x1="0" y1="0" x2="96" y2="0" stroke="#9fb3d1" stroke-width="2"/>
        <line x1="0" y1="-5" x2="0" y2="5" stroke="#9fb3d1" stroke-width="2"/>
        <line x1="48" y1="-4" x2="48" y2="4" stroke="#9fb3d1" stroke-width="1.5"/>
        <line x1="96" y1="-5" x2="96" y2="5" stroke="#9fb3d1" stroke-width="2"/>
        <text x="0" y="18" fill="#c3d4ec" font-family="Consolas, monospace" font-size="10">0</text>
        <text x="84" y="18" text-anchor="end" fill="#c3d4ec" font-family="Consolas, monospace" font-size="10">1 mm</text>
      </g>
    </g>
  </g>
  <text x="742" y="452" text-anchor="middle" fill="#6d86b3" font-family="Consolas, monospace" font-size="10.5" letter-spacing="2.6">×40 MAGNIFICATION</text>

  <!-- right side readouts -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#7d94ba">
    <text x="912" y="120" text-anchor="end">EXPOSURE 4.2 ms</text>
    <text x="912" y="140" text-anchor="end">THRESHOLD 0.60 mm</text>
    <text x="912" y="160" text-anchor="end">SCORE 0.91</text>
  </g>

  <!-- bottom status bar -->
  <rect x="0" y="518" width="960" height="82" fill="#060c17" fill-opacity="0.94"/>
  <line x1="0" y1="518" x2="960" y2="518" stroke="#1e3a6b"/>
  <rect x="24" y="540" width="76" height="38" rx="7" fill="url(#hazard)" stroke="#ef4444"/>
  <text x="62" y="565" text-anchor="middle" fill="#ffe4e4" font-family="Consolas, monospace" font-size="17" font-weight="700" letter-spacing="2">NG</text>
  <text x="120" y="556" fill="#ff8f8f" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700">판정 불량</text>
  <text x="120" y="575" fill="#8fa8cf" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="11.5">유형 · 미세 크랙 / 로트 JW-241118-02</text>

  <text x="936" y="556" text-anchor="end" fill="#9fd6bd" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="12" font-weight="700">전수 재검사 완료</text>
  <text x="936" y="575" text-anchor="end" fill="#6d86b3" font-family="Consolas, monospace" font-size="10.5">120 EA 선별 · 대체품 출하</text>
</svg>
