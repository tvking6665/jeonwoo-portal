<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="11월 4주차 생산계획 간트 차트">
  <defs>
    <linearGradient id="barBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f62e8"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="barGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#12b489"/>
      <stop offset="1" stop-color="#0e9f7a"/>
    </linearGradient>
    <linearGradient id="barViolet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#fef3c7"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#f0b429" stroke-width="2.5"/>
    </pattern>
  </defs>

  <rect width="960" height="540" fill="#ffffff"/>

  <!-- header -->
  <rect width="960" height="76" fill="#0b1b3a"/>
  <rect x="32" y="20" width="4" height="38" rx="2" fill="#3b6fe8"/>
  <text x="50" y="32" fill="#8fb0ee" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="600" letter-spacing="3.2">JEONWOO PRECISION · WEEKLY PRODUCTION PLAN</text>
  <text x="50" y="60" fill="#ffffff" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="21" font-weight="700">11월 4주차 생산계획</text>
  <text x="928" y="34" text-anchor="end" fill="#b9c9e8" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5">2026.11.23 – 11.27</text>
  <text x="928" y="56" text-anchor="end" fill="#7f9ac4" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="11.5">작성 · 생산기술팀</text>

  <!-- day header band -->
  <rect x="0" y="76" width="960" height="54" fill="#f6f8fc"/>
  <line x1="0" y1="130" x2="960" y2="130" stroke="#e4eaf3"/>

  <!-- column guide -->
  <g stroke="#eff3f9" stroke-width="1">
    <line x1="220" y1="130" x2="220" y2="430"/>
    <line x1="361.6" y1="130" x2="361.6" y2="430"/>
    <line x1="503.2" y1="130" x2="503.2" y2="430"/>
    <line x1="644.8" y1="130" x2="644.8" y2="430"/>
    <line x1="786.4" y1="130" x2="786.4" y2="430"/>
    <line x1="928" y1="130" x2="928" y2="430"/>
  </g>
  <g stroke="#f1f5fb" stroke-width="1">
    <line x1="220" y1="230" x2="928" y2="230"/>
    <line x1="220" y1="330" x2="928" y2="330"/>
  </g>

  <!-- day labels -->
  <g font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" text-anchor="middle">
    <text x="290.8" y="102" fill="#64748b" font-size="11.5">월</text><text x="290.8" y="119" fill="#0f1b2d" font-size="13" font-weight="700">11.23</text>
    <text x="432.4" y="102" fill="#64748b" font-size="11.5">화</text><text x="432.4" y="119" fill="#0f1b2d" font-size="13" font-weight="700">11.24</text>
    <text x="574" y="102" fill="#64748b" font-size="11.5">수</text><text x="574" y="119" fill="#0f1b2d" font-size="13" font-weight="700">11.25</text>
    <text x="715.6" y="102" fill="#64748b" font-size="11.5">목</text><text x="715.6" y="119" fill="#0f1b2d" font-size="13" font-weight="700">11.26</text>
    <text x="857.2" y="102" fill="#64748b" font-size="11.5">금</text><text x="857.2" y="119" fill="#0f1b2d" font-size="13" font-weight="700">11.27</text>
  </g>

  <!-- row labels -->
  <g font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
    <text x="32" y="176" fill="#1e293b" font-size="14.5" font-weight="700">1호 프레스</text>
    <text x="32" y="195" fill="#94a3b8" font-size="11">브래킷 · 2교대</text>
    <text x="32" y="276" fill="#1e293b" font-size="14.5" font-weight="700">2호 프레스</text>
    <text x="32" y="295" fill="#94a3b8" font-size="11">하우징 · 주간</text>
    <text x="32" y="376" fill="#1e293b" font-size="14.5" font-weight="700">조립 · 검사</text>
    <text x="32" y="395" fill="#94a3b8" font-size="11">3,000 EA</text>
  </g>

  <!-- bars -->
  <g font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
    <rect x="228" y="163" width="550" height="34" rx="7" fill="url(#barBlue)"/>
    <text x="246" y="185" fill="#ffffff" font-size="12.5" font-weight="600">브래킷 JW-BRK-2041 · 6,000 EA</text>

    <rect x="228" y="263" width="266" height="34" rx="7" fill="url(#barGreen)"/>
    <text x="246" y="285" fill="#ffffff" font-size="12.5" font-weight="600">하우징 4,000 EA</text>

    <rect x="502" y="263" width="138" height="34" rx="7" fill="url(#hatch)" stroke="#eab308" stroke-dasharray="4 3"/>
    <text x="571" y="285" text-anchor="middle" fill="#a16207" font-size="11.5" font-weight="700">금형 교체</text>

    <rect x="648" y="263" width="130" height="34" rx="7" fill="url(#barGreen)" opacity="0.85"/>
    <text x="713" y="285" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="600">1,200 EA</text>

    <rect x="510" y="363" width="268" height="34" rx="7" fill="url(#barViolet)"/>
    <text x="644" y="385" text-anchor="middle" fill="#ffffff" font-size="12.5" font-weight="600">조립 · 검사 3,000 EA</text>
  </g>

  <!-- footer summary -->
  <line x1="0" y1="430" x2="960" y2="430" stroke="#e4eaf3"/>
  <g font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
    <rect x="32" y="452" width="272" height="62" rx="10" fill="#f8fafc" stroke="#e8edf5"/>
    <text x="50" y="475" fill="#94a3b8" font-size="11.5">주간 계획 수량</text>
    <text x="50" y="499" fill="#0f1b2d" font-size="19" font-weight="700">12,000 EA</text>

    <rect x="320" y="452" width="272" height="62" rx="10" fill="#f8fafc" stroke="#e8edf5"/>
    <text x="338" y="475" fill="#94a3b8" font-size="11.5">설비 가동률</text>
    <text x="338" y="499" fill="#0e9f7a" font-size="19" font-weight="700">92%</text>
    <rect x="470" y="486" width="104" height="6" rx="3" fill="#e2e8f0"/>
    <rect x="470" y="486" width="95" height="6" rx="3" fill="#0e9f7a"/>

    <rect x="608" y="452" width="272" height="62" rx="10" fill="#f8fafc" stroke="#e8edf5"/>
    <text x="626" y="475" fill="#94a3b8" font-size="11.5">납기 준수</text>
    <text x="626" y="499" fill="#2563eb" font-size="19" font-weight="700">100%</text>
    <text x="862" y="499" text-anchor="end" fill="#94a3b8" font-size="11">3개 라인</text>
  </g>
</svg>
